name: Render

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic folder to render
        required: true
        type: choice
        options:
          - 01-matter-states-phase-diagrams
          - 02-atomic-structure-isotopes-mass-spectra
          - 03-quantum-model-orbitals
          - 04-electron-configuration-aufbau-hund-pauli
          - 09-lewis-structures-formal-charge-resonance

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.topic }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TOPIC: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect framework
        id: detect
        run: |
          if [ ! -d "$TOPIC" ]; then
            echo "::error::Topic folder '$TOPIC' does not exist on ${{ github.ref_name }}."
            exit 1
          fi
          if [ -f "$TOPIC/package.json" ] && grep -q '"remotion"' "$TOPIC/package.json"; then
            echo "framework=remotion" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported framework found in '$TOPIC'."
            exit 1
          fi
          if [ -f "$TOPIC/package-lock.json" ]; then
            echo "lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.detect.outputs.framework == 'remotion'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate lockfile
        if: steps.detect.outputs.framework == 'remotion' && steps.detect.outputs.lockfile == 'false'
        working-directory: ${{ inputs.topic }}
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Upload generated lockfile
        if: steps.detect.outputs.framework == 'remotion' && steps.detect.outputs.lockfile == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.topic }}-lockfile
          path: ${{ inputs.topic }}/package-lock.json
          if-no-files-found: error

      - name: Install dependencies
        if: steps.detect.outputs.framework == 'remotion'
        working-directory: ${{ inputs.topic }}
        run: npm ci --no-audit --no-fund

      - name: Cache TTS model
        if: steps.detect.outputs.framework == 'remotion'
        uses: actions/cache@v4
        with:
          path: ${{ inputs.topic }}/.cache/huggingface
          key: hf-${{ inputs.topic }}-${{ hashFiles(format('{0}/audio/model.json', inputs.topic)) }}

      - name: Check
        id: check
        if: steps.detect.outputs.framework == 'remotion'
        working-directory: ${{ inputs.topic }}
        run: |
          npm run typecheck
          npm run lint
          if ! npm run format:check; then
            npx prettier --write . > /dev/null
            git diff > "$RUNNER_TEMP/format.patch"
            echo "format_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload formatting patch
        if: failure() && steps.check.outputs.format_failed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.topic }}-format-patch
          path: ${{ runner.temp }}/format.patch

      - name: Install browser
        if: steps.detect.outputs.framework == 'remotion'
        working-directory: ${{ inputs.topic }}
        run: npx remotion browser ensure

      - name: Build
        if: steps.detect.outputs.framework == 'remotion'
        working-directory: ${{ inputs.topic }}
        run: npm run build

      - name: Upload render
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.topic }}
          path: ${{ inputs.topic }}/out/
          if-no-files-found: error
